<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Vastra Mane</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "DM Sans", Arial, sans-serif; background: #faf8f5; color: #29231f; }
        a { text-decoration: none; }

        .header {
            background: #fff; border-bottom: 1px solid #eee4dc; min-height: 78px;
            padding: 0 5%; display: flex; align-items: center; justify-content: space-between;
        }
        .brand { display: flex; align-items: center; gap: 11px; }
        .brand-icon {
            width: 43px; height: 43px; border-radius: 50%;
            background: linear-gradient(135deg, #8d2437, #c68b43); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: "Playfair Display", serif; font-size: 20px; font-weight: 700;
        }
        .brand-text h1 { font-family: "Playfair Display", serif; font-size: 25px; color: #5c1725; line-height: 1; }
        .brand-text span { display: block; font-size: 10px; letter-spacing: 2px; color: #a47b55; margin-top: 4px; text-transform: uppercase; }

        .page-container { max-width: 950px; margin: 0 auto; padding: 38px 22px 70px; }

        .page-heading { margin-bottom: 26px; }
        .page-heading .small-title { color: #a47b55; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin-bottom: 7px; }
        .page-heading h2 { font-family: "Playfair Display", serif; color: #351b20; font-size: clamp(28px, 4vw, 38px); }

        .checkout-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 28px; align-items: start; }

        .form-card, .summary-card {
            background: #fff; border: 1px solid #eee2d9; border-radius: 18px; padding: 28px;
            box-shadow: 0 9px 30px rgba(74, 43, 25, .07);
        }

        .form-card h3, .summary-card h3 { font-family: "Playfair Display", serif; font-size: 22px; color: #351b20; margin-bottom: 18px; }

        .form-group { margin-bottom: 16px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #4b3931; margin-bottom: 6px; }
        input, textarea {
            width: 100%; padding: 11px 13px; border: 1px solid #e6d9cf; border-radius: 9px;
            font-family: inherit; font-size: 14px; color: #29231f; background: #fdfbf9;
        }
        input:focus, textarea:focus { outline: none; border-color: #8d2437; }
        textarea { resize: vertical; min-height: 70px; }

        .error-box {
            background: #fdecec; color: #b52c2c; border: 1px solid #f0cccc; border-radius: 10px;
            padding: 12px 15px; margin-bottom: 18px; font-size: 13.5px;
        }

        .submit-btn {
            width: 100%; border: none; background: linear-gradient(135deg, #5c1725, #8d2437);
            color: #fff; padding: 14px; border-radius: 10px; font-size: 14.5px; font-weight: 700;
            cursor: pointer; margin-top: 6px;
        }
        .submit-btn:hover { transform: translateY(-1px); }

        .summary-line { display: flex; justify-content: space-between; font-size: 14px; color: #70645e; padding: 8px 0; }
        .summary-line span:last-child { color: #332725; font-weight: 600; }
        .summary-divider { border: none; border-top: 1px dashed #ddd1c7; margin: 8px 0; }
        .summary-total { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; }
        .summary-total span:first-child { font-weight: 600; color: #44332e; }
        .summary-total span:last-child { color: #8d2437; font-family: "Playfair Display", serif; font-size: 23px; font-weight: 700; }

        .mini-item { font-size: 12.5px; color: #776d67; padding: 6px 0; border-bottom: 1px dashed #eee2d9; }
        .mini-item b { color: #4b3931; }

        @media (max-width: 850px) {
            .checkout-layout { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<header class="header">
    <a th:href="@{/}" class="brand">
        <div class="brand-icon">V</div>
        <div class="brand-text">
            <h1>Vastra Mane</h1>
            <span>Silk & Sarees</span>
        </div>
    </a>
    <a th:href="@{/cart}" class="continue-shopping" style="color:#5c1725;font-size:14px;font-weight:600;">← Back to Cart</a>
</header>

<main class="page-container">

    <div class="page-heading">
        <div class="small-title">Almost there</div>
        <h2>Delivery Details</h2>
    </div>

    <div class="error-box" th:if="${error != null}" th:text="${error}"></div>

    <div class="checkout-layout">

        <section class="form-card">
            <h3>Your Information</h3>

            <form th:action="@{/checkout/send-otp}" th:object="${checkoutData}" method="post">

                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" th:field="*{name}" placeholder="e.g. Priya Sharma" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" th:field="*{phone}" placeholder="10-digit mobile number" maxlength="10" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" th:field="*{email}" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Address *</label>
                    <textarea th:field="*{address}" placeholder="House no., street, locality" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>City *</label>
                        <input type="text" th:field="*{city}" required>
                    </div>
                    <div class="form-group">
                        <label>State *</label>
                        <input type="text" th:field="*{state}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Pincode *</label>
                    <input type="text" th:field="*{pincode}" maxlength="6" placeholder="6-digit pincode" required>
                </div>

                <button type="submit" class="submit-btn">Send OTP to Email →</button>

            </form>
        </section>

        <aside class="summary-card">
            <h3>Order Summary</h3>

            <div class="mini-item" th:each="item : ${cart.items}">
                <b th:text="${item.productName}">Item</b> ×
                <span th:text="${item.quantity}">1</span>
                — ₹<span th:text="${item.price * item.quantity}">0</span>
            </div>

            <hr class="summary-divider">

            <div class="summary-line">
                <span>Items</span>
                <span th:text="${cart.items.size()}">0</span>
            </div>
            <div class="summary-line">
                <span>Delivery</span>
                <span>Free</span>
            </div>

            <hr class="summary-divider">

            <div class="summary-total">
                <span>Total</span>
                <span>₹<span th:text="${totalAmount}">0</span></span>
            </div>
        </aside>

    </div>

</main>

</body>
</html>
