<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | Vastra Mane</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "DM Sans", Arial, sans-serif; background: #faf8f5; color: #29231f;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: #fff; border: 1px solid #eee2d9; border-radius: 20px; padding: 40px 34px;
            max-width: 420px; width: 100%; text-align: center; box-shadow: 0 12px 35px rgba(74,43,25,.08);
        }
        .icon {
            width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px;
            background: #f8eee8; display: flex; align-items: center; justify-content: center; font-size: 28px;
        }
        h2 { font-family: "Playfair Display", serif; color: #351b20; font-size: 25px; margin-bottom: 8px; }
        p.desc { color: #776d67; font-size: 14px; margin-bottom: 22px; }
        p.desc b { color: #4b3931; }

        .error-box, .info-box {
            border-radius: 10px; padding: 11px 14px; margin-bottom: 18px; font-size: 13.5px; text-align: left;
        }
        .error-box { background: #fdecec; color: #b52c2c; border: 1px solid #f0cccc; }
        .info-box { background: #edf8ef; color: #256b32; border: 1px solid #cce8d0; }

        input.otp-input {
            width: 100%; text-align: center; letter-spacing: 10px; font-size: 26px; font-weight: 700;
            padding: 14px; border-radius: 10px; border: 1px solid #e6d9cf; color: #5c1725;
            background: #fdfbf9; margin-bottom: 18px;
        }
        input.otp-input:focus { outline: none; border-color: #8d2437; }

        .submit-btn {
            width: 100%; border: none; background: linear-gradient(135deg, #5c1725, #8d2437);
            color: #fff; padding: 14px; border-radius: 10px; font-size: 14.5px; font-weight: 700; cursor: pointer;
        }

        .resend-form { margin-top: 16px; }
        .resend-btn {
            background: none; border: none; color: #8d2437; font-weight: 600; font-size: 13px;
            cursor: pointer; text-decoration: underline;
        }

        .back-link { display: block; margin-top: 18px; color: #a47b55; font-size: 13px; text-decoration: none; }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">📧</div>

    <h2>Verify Your Email</h2>

    <p class="desc">We've sent a 6-digit OTP to <b th:text="${maskedEmail}">e***@example.com</b>. It is valid for 5 minutes.</p>

    <div class="error-box" th:if="${error != null}" th:text="${error}"></div>
    <div class="info-box" th:if="${message != null}" th:text="${message}"></div>

    <form th:action="@{/checkout/verify}" method="post">
        <input type="text" name="otp" class="otp-input" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="••••••" required autofocus>
        <button type="submit" class="submit-btn">Verify &amp; Place Order →</button>
    </form>

    <form class="resend-form" th:action="@{/checkout/resend-otp}" method="post">
        <span style="font-size:13px;color:#8c817a;">Didn't get the code?</span>
        <button type="submit" class="resend-btn">Resend OTP</button>
    </form>

    <a th:href="@{/checkout}" class="back-link">← Edit delivery details</a>

</div>

</body>
</html>
